name: Verify coffee

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.0"
      node-version: "24.22.1"
      install-policy: "project"
      build: true
      build-command: "bun run build && bunx wrangler deploy --dry-run"
      test-command: "bun run test"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"

  browser-e2e:
    name: "L3 Browser E2E"
    needs: quality
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime: "bun"
      runtime-version: "1.4.0"
      node-version: "24.22.1"
      install-policy: "project"
      browser: "chromium"
      timeout-minutes: 15
      pre-command: "bun run build"
      command: "bun run test:e2e"
      env-json: '{"PLAYWRIGHT_BROWSERS_PATH": ".work/browsers", "CI": "true"}'
      artifact-name: "browser-failure-report"
      artifact-path: |
        playwright-report/
        test-results/
