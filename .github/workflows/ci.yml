name: Verify coffee

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.4.0"
      node-version: "24.14.0"
      install-policy: "project"
      build: true
      build-command: "bun run build && bunx wrangler deploy --dry-run"
      test-command: "bun run test"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      l3: true
      l3-command: "bun run test:e2e"
      l3-browser: "chromium"
      env-json: '{"PLAYWRIGHT_BROWSERS_PATH": ".work/browsers"}'
    secrets: inherit
